name: Validate CV site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate HTML and asset references
        run: python3 scripts/check_site.py
