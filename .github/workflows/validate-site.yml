name: Validate CV site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate HTML and asset references
        run: python3 scripts/check_site.py
      - name: Add preview URL to Actions summary
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Live HTML preview'
            echo "Preview: https://raw.githack.com/${GITHUB_REPOSITORY}/${PR_HEAD_SHA}/index.html"
            echo 'Preview is hosted by a third-party service, independent from cv.eplus.dev.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update preview comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cv-pr-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const url = `https://raw.githack.com/${owner}/${repo}/${sha}/index.html`;
            const body = [
              marker,
              '### Live CV preview',
              `**[Open preview (PR #${issue_number})](${url})**`,
              '',
              'This is a third-party HTML preview of the PR commit, not a deployment to the production domain. It may show a one-time confirmation screen. Do not enter sensitive data.',
              '',
              `Current version: https://cv.eplus.dev/ · Commit: \`${sha.slice(0, 12)}\``
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
